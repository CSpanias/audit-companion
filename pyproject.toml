[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-companion"
version = "0.1.0"
description = "A framework for guided, live security assessments."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "rich-argparse>=1.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
docs = ["mkdocs-material>=9.6.0"]

[project.scripts]
audit-companion = "audit_companion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
