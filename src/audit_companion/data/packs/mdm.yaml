- id: intune-inactive-device-clean-up-rule
  question: Is a device clean-up rule configured for inactive devices?
  expected_value: A device clean-up rule is configured. Remove devices that haven't checked  in for this
    many days is set to 60 days or less.
  expected_answer: compliant
  finding_title: Inactive Device Clean-Up Rule Not Configured
  description: Devices that had not checked in to the MDM platform for an extended period  were not automatically
    identified and managed through an inactive device  clean-up process.
  solution: Configure an inactive device clean-up rule that automatically retires, removes, or otherwise
    manages devices that have not checked in within an  appropriate period.
  theme: Patch and Lifecycle Management
  section: cleanup_rules
  commentary_group: Device Lifecycle and Compliance
  remediation_id: inactive_devices
  commentary: 'Devices that no longer communicate with the MDM platform may remain visible  as managed
    devices despite no longer receiving policy updates, compliance  evaluation, or administrative oversight.
    Over time this may reduce  visibility of the active device estate and complicate asset management,  monitoring,
    and security oversight.

    Automated clean-up rules help identify and manage inactive devices by  applying actions such as retirement,
    removal, or other lifecycle controls  after a defined period of inactivity.'
  positive: Inactive devices were automatically identified and managed through a defined device clean-up
    process.
  positive_summary_commentary: Inactive devices were identified and managed through a defined clean-up process.
  positive_summary_priority: 8
  guidance:
    intune: Devices > Organize devices > Device clean-up rules > Click target rule > Check Rule settings
  applies_when:
    platforms:
    - iOS
    - Android
  repeat_for:
  - platforms
