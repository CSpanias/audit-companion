id: mdm
title: Mobile Device Management Security Assessment
version: '1.0'
executive_summary: >-
  A Mobile Device Management (MDM) review was conducted for {client_name}, covering managed {platforms}
  devices managed through {mdm_vendor}. The assessment considered device compliance requirements,
  authentication controls, application governance, data protection, and platform-specific security restrictions.
executive_summary_findings_intro: >-
  The review identified opportunities for improvement across {areas}.
executive_summary_conclusion: >-
  Addressing the identified gaps would further strengthen the organisation's mobile security posture and
  improve assurance that managed devices remain secure and aligned with organisational requirements.
executive_summary_positive_conclusion: >-
  Overall, the assessed configuration provides a sound foundation for securely managing mobile devices and
  protecting corporate information.
positive_summary_intro: >-
  Key strengths included {strengths}. These controls provide a solid security baseline and support the
  protection of corporate information on managed devices.
commentary_intro: >-
  A Mobile Device Management (MDM) review was conducted for {client_name}, covering {mdm_vendor} policies
  for managed {platforms} devices. The assessment reviewed the effectiveness of controls used to secure
  managed mobile devices and protect corporate information.
commentary_findings_intro: >-
  The review identified findings across {areas}. The following sections summarise the control observations
  and positive practices by platform.
configuration_intro: >-
  The assessed mobile device management environment is summarised below.
remediation_intro: "The following remediation actions are recommended:"
report_scope_field: platforms
report_groups:
  Authentication and Access Control:
    commentary_label: Authentication and Access Control
    executive_summary_label: authentication and access control
    executive_summary_priority: strengthening device authentication requirements
    executive_summary_intro: Opportunities for improvement were identified in authentication and access control.
    executive_summary_conclusion: Weak or inconsistent device authentication requirements may increase the risk
      of unauthorised access to managed devices and locally stored information.
    commentary_intro: The review identified opportunities to strengthen authentication and access control settings.
    commentary_conclusion: Strong device authentication controls help protect locally stored information and reduce
      the risk of unauthorised device access.
  Application Governance:
    commentary_label: Application Governance
    executive_summary_label: application governance
    executive_summary_priority: strengthening application governance
    executive_summary_intro: The assessment also considered application governance.
    executive_summary_conclusion: Appropriate application controls help reduce the risk of unapproved software
      accessing or disclosing corporate information.
    commentary_intro: Application access and management controls were reviewed.
    commentary_conclusion: Maintaining oversight of approved applications supports consistent protection of
      corporate information across managed devices.
  Data Protection:
    commentary_label: Data Protection
    executive_summary_label: data protection
    executive_summary_priority: strengthening controls protecting corporate information
    executive_summary_intro: Opportunities for improvement were identified in data protection.
    executive_summary_conclusion: These controls help limit unauthorised disclosure or transfer of corporate
      information from managed devices.
    commentary_intro: The review considered controls intended to protect corporate information on managed devices.
    commentary_conclusion: Effective data protection controls reduce exposure if devices or information are lost,
      accessed, or shared inappropriately.
  Device Lifecycle and Compliance:
    commentary_label: Lifecycle and Compliance
    executive_summary_label: device lifecycle and compliance
    executive_summary_priority: maintaining supported and compliant devices
    executive_summary_intro: Device lifecycle and compliance were also reviewed.
    executive_summary_conclusion: Regular lifecycle oversight helps ensure devices remain supported, visible, and
      aligned with organisational security requirements.
    commentary_intro: Findings related to device lifecycle management and compliance oversight.
    commentary_conclusion: Timely review of device status and lifecycle settings helps maintain assurance over the
      managed mobile estate.
  Device Security and Hardening:
    commentary_label: Device Security and Hardening
    executive_summary_label: device security and hardening
    executive_summary_priority: strengthening mobile device hardening
    executive_summary_intro: The review identified opportunities to strengthen device security and hardening.
    executive_summary_conclusion: Hardening measures reduce exposure to unauthorised device interaction and help
      preserve platform security protections.
    commentary_intro: Device security and platform hardening controls were assessed.
    commentary_conclusion: Applying appropriate hardening settings helps reduce risks associated with physical
      access and weakened device protections.
