- id: logs-not-centrally-exported
  question: Are logs exported to a centralised and access-controlled location?
  expected_value: "- Enable Syslog: Enable\n  - Log Security Level: ?\n  - Syslog TLS Context: Configured"
  expected_answer: compliant
  finding_title: Security Logs Not Exported to Central Monitoring Platform
  description: Logs were stored locally only or were not adequately protected from  modification.
  solution: Forward logs to a centralised logging platform and restrict access to  authorised personnel.
  theme: Monitoring and Detection
  section: monitoring
  commentary_group: Logging and Monitoring
  remediation_id: logging_and_monitoring
  commentary: Centralised log collection improves the ability to detect and investigate  security incidents
    affecting VoIP infrastructure. Authentication events,  configuration changes, administrative activity,
    and intrusion detection  alerts may be lost if logs are retained only on the local device.
  positive: Logs were exported to a centralised and access-controlled repository.
  guidance:
    common: "Determine whether logs are forwarded to an external logging platform and \nwhether they are\
      \ retained outside the local device. Evidence may include:\n\n- Syslog server configuration\n- SIEM\
      \ integration\n- Remote log collectors\n- Central monitoring platforms"
    audiocodes: Troubleshoot > Logging > Logging Settings
  references:
  - https://www.ncsc.gov.uk/guidance/private-branch-exchange-best-practice
  - https://techdocs.audiocodes.com/session-border-controller-sbc/security/version-740/Content/Security/Enable%20Syslog.htm
  applies_when:
    voip_solution:
    - AudioCodes
