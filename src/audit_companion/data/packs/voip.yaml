id: voip
title: VoIP Security Assessment
version: '1.0'
sureformat_assessment:
  id: SC-1830
  description: A review of the organisation's VoIP configuration was performed.
executive_summary: >-
  A VoIP security configuration review was performed for the {client_name} {voip_solution} platform and its
  {device_type} component to assess the effectiveness of controls protecting telephony services, management
  interfaces, and communications. The assessment evaluated controls relating to platform security,
  authentication, administrative access, communications protection, monitoring, and operational resilience.
executive_summary_findings_intro: >-
  The assessment identified opportunities to strengthen security across {areas}.
executive_summary_conclusion: >-
  Addressing the identified gaps would strengthen the security posture and operational resilience of the VoIP
  environment and provide greater assurance over business-critical telephony services.
commentary_intro: |
  A VoIP security configuration review was conducted for {client_name}, covering the {voip_solution}
  platform and its {device_type} component. The assessment evaluated controls relating to platform security,
  authentication, administrative access, communications protection, monitoring, and operational resilience.
commentary_findings_intro: >-
  The review identified opportunities to strengthen the overall security posture of the VoIP environment across
  {areas}. These weaknesses may increase the risk of unauthorised access, credential compromise, interception
  of communications, fraud, service disruption, and delayed detection of malicious activity.
configuration_intro: >-
  The table below summarises the key attributes of the assessed deployment and the configuration reviewed as
  part of this assessment.
remediation_intro: >-
  To address the identified observations and strengthen the security posture of the VoIP environment:
report_groups:
  Platform Lifecycle Management:
    executive_summary_label: platform lifecycle management
    executive_summary_priority: upgrading the platform to a vendor-supported version
    executive_summary_intro: A significant theme related to platform lifecycle management.
    executive_summary_conclusion: Unsupported software reduces assurance that newly discovered security issues
      will be remediated and may expose the platform to publicly known vulnerabilities.
    commentary_intro: The platform lifecycle review identified a supportability concern.
    commentary_conclusion: Maintaining vendor-supported software is important to reducing operational and
      security risk for business-critical telephony services.
  Authentication and Identity Security:
    executive_summary_label: authentication and identity
    executive_summary_priority: strengthening administrator authentication and identity controls
    executive_summary_intro: A significant theme related to authentication and access management.
    executive_summary_conclusion: Collectively, these weaknesses increase the likelihood of credential compromise,
      reduce accountability, and may expose critical telephony services to unauthorised access.
    commentary_intro: The review identified gaps in administrator authentication and identity management.
    commentary_conclusion: Collectively, these weaknesses increase the risk of credential compromise and
      unauthorised administrative access to the VoIP platform.
  Administrative Interface Security:
    executive_summary_label: administrative interface security
    executive_summary_priority: securing administrative interfaces and privileged roles
    executive_summary_intro: The review also identified concerns relating to administrative interface security
      and platform hardening.
    executive_summary_conclusion: These gaps may increase exposure of administrative credentials and configuration
      interfaces to unauthorised access or interception by attackers with network access.
    commentary_intro: A number of management interface controls were either absent or insufficiently configured.
    commentary_conclusion: These weaknesses increase the attack surface of the management environment and may
      expose administrative credentials, sessions, and platform configuration to unnecessary risk.
  Administrative Access Control:
    executive_summary_label: administrative access governance
    executive_summary_priority: restricting and periodically reviewing privileged access
    executive_summary_intro: Administrative access governance also requires attention.
    executive_summary_conclusion: These conditions may leave unnecessary privileged access in place and increase
      the potential impact of account compromise.
    commentary_intro: Management access restrictions and periodic access reviews could be strengthened.
    commentary_conclusion: Effective access governance is particularly important for systems that provide control
      over business communications infrastructure.
  Cryptography and Communications Security:
    executive_summary_label: communications security
    executive_summary_priority: enforcing encryption for administrative and VoIP communications
    executive_summary_intro: The review identified concerns relating to cryptography and communications security.
    executive_summary_conclusion: Sensitive call information, authentication data, and voice communications may
      be susceptible to interception or manipulation where an attacker can access the underlying network.
    commentary_intro: The review identified weaknesses in cryptographic controls and communications protection.
    commentary_conclusion: Strong cryptographic controls are essential for protecting the confidentiality and
      integrity of VoIP services, particularly where communications traverse shared or untrusted networks.
  Threat Detection and Protection:
    executive_summary_label: threat detection and protection
    executive_summary_priority: improving threat detection and restricting unauthenticated calls
    executive_summary_intro: The assessment identified concerns relating to threat detection and protection.
    executive_summary_conclusion: These weaknesses may increase exposure to fraudulent call activity and reduce
      the organisation's ability to detect or respond to attacks targeting telephony infrastructure.
    commentary_intro: Threat detection and prevention capabilities could be strengthened.
    commentary_conclusion: These gaps reduce the organisation's ability to prevent or rapidly detect attacks
      targeting telephony infrastructure.
  Logging and Monitoring:
    executive_summary_label: security monitoring
    executive_summary_priority: improving audit logging and central monitoring
    executive_summary_intro: Finally, security monitoring requires improvement.
    executive_summary_conclusion: These conditions may hinder the detection of malicious activity, incident
      response, and forensic investigation.
    commentary_intro: Security monitoring controls did not provide comprehensive visibility of platform activity.
    commentary_conclusion: These limitations may hinder the detection of malicious activity and reduce the
      effectiveness of incident response and forensic investigation following a security event.
context:
- id: client_name
  label: What is the organisation's name?
  report_label: Organisation
  type: text
  phase: setup
  required: true
- id: voip_solution
  label: Which VoIP platform vendor is being reviewed?
  report_label: VoIP Platform Vendor
  type: choice
  phase: setup
  required: true
  options:
  - AudioCodes
- id: device_type
  label: Which VoIP platform component is being assessed?
  report_label: Platform Component
  type: choice
  phase: context
  required: true
  options:
  - Session Border Controller (SBC)
  - Voice Gateway
  - Private Branch Exchange (PBX) / Call Manager
  - Cloud Voice Platform
  - Mixed Environment
  applies_when:
    voip_solution:
    - AudioCodes
- id: deployment_type
  label: How is the VoIP solution deployed?
  report_label: Deployment Model
  type: choice
  phase: context
  required: true
  options:
  - Cloud Hosted
  - On-Premises
  - Hybrid
  - Other
  applies_when:
    voip_solution:
    - AudioCodes
- id: identity_provider
  label: What is the primary identity provider / authentication source?
  report_label: Identity Provider
  type: choice
  phase: context
  required: true
  options:
  - Microsoft Entra ID
  - Active Directory
  - LDAP
  - RADIUS
  - Local Accounts
  - SAML / SSO
  - Other
  guidance:
    common: Identify the authentication source used for administrator access to the VoIP platform. This
      may differ from user authentication mechanisms used by telephony services.
  applies_when:
    voip_solution:
    - AudioCodes
- id: sip_provider
  label: Which telephony service provider (SIP trunk) is used?
  report_label: SIP Trunk Provider
  type: text
  phase: context
  required: true
  guidance:
    common: Record the external SIP service provider used for PSTN connectivity. Examples include BT,
      Gamma, Vodafone, Virgin Media Business, and others.
  applies_when:
    voip_solution:
    - AudioCodes
- id: platform_model
  label: What platform model is being reviewed?
  report_label: Platform Model
  type: text
  phase: context
  required: true
  guidance:
    common: Record the exact platform model (e.g. Mediant VE SBC, Mediant 800 SBC, Mediant 1000 Gateway,
      Cisco Unified Border Element, or an equivalent model).
    audiocodes: Monitor > Summary > Device Information > Product Name
  applies_when:
    voip_solution:
    - AudioCodes
- id: software_version
