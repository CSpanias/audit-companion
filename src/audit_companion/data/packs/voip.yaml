- id: weak-tls-configuration
  question: Are only supported TLS versions permitted for administrative and VoIP communications?
  expected_value: Only TLS 1.2 and/or TLS 1.3 are permitted
  expected_answer: compliant
  finding_title: Weak TLS Configuration
  description: Older TLS versions were permitted for management or VoIP communications.
  solution: Enforce the use of TLS 1.2 and TLS 1.3 for management and VoIP  communications by removing
    support for older protocol versions.
  theme: Cryptography
  section: cryptography
  commentary_group: Cryptography and Communications Security
  remediation_id: cryptography_and_communications
  commentary: Deprecated TLS versions contain known weaknesses and may expose management  interfaces and
    VoIP communications to downgrade and cryptographic attacks.
  positive: VoIP communications were restricted to supported TLS versions.
  guidance:
    common: "TLSv1.2, TLSv1.3, or TLSv1.2 and TLSv1.3 enabled. TLS 1.0 and TLS 1.1 \ndisabled."
    audiocodes: Setup > IP Network tab > Security folder > TLS Contexts > TLS Version
  references:
  - https://www.ncsc.gov.uk/guidance/private-branch-exchange-best-practice
  - https://techdocs.audiocodes.com/session-border-controller-sbc/security/version-740/Content/Security/Use%20TLS%20Version%201%202%20or%201%203.htm
  applies_when:
    voip_solution:
    - AudioCodes
- id: weak-cryptography
  question: Are only supported cryptographic algorithms and cipher suites permitted?
  expected_value: '- Cipher Server and Cipher Client: DEFAULT is accepted

    - Key Exchange Groups: X25519:P-256:P-384:X448 (default)

    - DH Key Size: 2048 bits or greater'
  expected_answer: compliant
  finding_title: Weak Cryptographic Algorithms Permitted
  description: Weak or deprecated cryptographic algorithms, key exchange settings, or  cryptographic parameters
    remained enabled.
  solution: Align cryptographic settings with current vendor guidance and industry best  practice. Remove
    support for deprecated cipher suites, weak cryptographic  algorithms, and insufficient key exchange
    parameters.
  theme: Cryptography
  section: cryptography
  commentary_group: Cryptography and Communications Security
  remediation_id: cryptography_and_communications
  commentary: Weak or deprecated cryptographic settings may reduce the confidentiality  and integrity
    of administrative and VoIP communications. Legacy cipher  suites, weak key exchange mechanisms, and
    insufficient cryptographic  parameters may increase the risk of interception, downgrade attacks, or  compromise
    of encrypted communications.
  positive: Strong, modern cryptographic algorithms and key exchange parameters were  enforced.
  guidance:
    common: 'Review cryptographic configuration including cipher suites, encryption

      algorithms, key exchange groups, and Diffie-Hellman parameters.

      Confirm deprecated, weak, or unnecessary cryptographic algorithms

      are disabled.'
    audiocodes: "Setup > IP Network tab > Security folder > TLS Contexts > \nCipher Server / Cipher Client\
      \ / Key Exchange Groups / DH Key Size"
  applies_when:
    voip_solution:
    - AudioCodes
  references:
  - https://www.ncsc.gov.uk/guidance/private-branch-exchange-best-practice
- id: signalling-and-media-encryption-not-enforced
  question: Are SIP signalling (SIPS) and voice communications (SRTP) encrypted where supported?
  expected_value: "TLS and SRTP are enabled where supported by connected systems and service \nproviders.\n\
    \  - Media Security: Enable (SRTP)\n  - SIPS: Enable (SIPS)\n\nWhere encryption is not supported,\
    \ the limitation should be documented."
  expected_answer: compliant
  finding_title: VoIP Signalling and Media Encryption Not Enforced
  description: SIP signalling and/or RTP media traffic were transmitted without encryption  despite support
    for SIPS and SRTP being available.
  solution: Enable SIPS (SIP over TLS) for SIP signalling and Secure RTP (SRTP) for  voice media wherever
    supported by connected platforms, gateways, PBXs, and  service providers.
  theme: Cryptography
  section: cryptography
  commentary_group: Cryptography and Communications Security
  remediation_id: cryptography_and_communications
  commentary: 'VoIP communications consist of SIP signalling and RTP media traffic. SIP  signalling contains
    information used to establish and manage calls, while  RTP carries the voice conversation itself.

    Without SIPS (SIP over TLS), call metadata, routing information, and authentication details may be
    exposed to interception or manipulation. Without SRTP, voice conversations may be susceptible to eavesdropping
    by  attackers with access to the network path.'
  positive: SIP signalling was protected using SIPS and voice media was protected using  SRTP where supported
    by connected systems.
  guidance:
    common: "Review SIP trunk, gateway, and VoIP security configuration to determine \nwhether SIP signalling\
      \ is protected using TLS and whether voice \ncommunications are protected using SRTP where supported\
      \ by connected \nsystems and service providers."
    audiocodes: 'Setup > Signaling & Media > Media > Media Security (SRTP)


      Setup > Signaling & Media > SIP Definitions > Transport Settings (SIPS)'
  references:
  - https://www.ncsc.gov.uk/guidance/private-branch-exchange-best-practice
  - https://techdocs.audiocodes.com/session-border-controller-sbc/security/version-740/Content/Security/Secure%20SIP%20using%20TLS%20SIPS.htm
  - https://techdocs.audiocodes.com/session-border-controller-sbc/security/version-740/Content/Security/Secure%20Media%20RTP%20Traffic%20using.htm
  applies_when:
    voip_solution:
    - AudioCodes
- id: ids-not-configured
  question: Are intrusion detection controls configured to detect and respond to malicious SIP activity?
  expected_value: "For IDS:\n  - Intrusion Detection System (IDS): Enable\n  - One or more IDS Policies\
    \ are configured and applied.\n\nFor Malicious Signatures:\n- Malicious signatures configured\n- Malicious\
    \ Signature Database: Enable\n- Message Policy: Policy applied per SIP interface"
  expected_answer: compliant
  finding_title: Intrusion Detection Controls Not Configured
  description: Intrusion detection controls were not configured to detect or respond to  malicious SIP
    activity.
  solution: Enable intrusion detection functionality and configure policies that detect  authentication
    failures, malformed SIP messages, connection abuse, dialog  establishment failures, and other suspicious
    activity. Configure alerting  and blocking thresholds appropriate to the deployment.
  theme: Threat Protection
  section: threat_protection
  commentary_group: Threat Detection and Protection
  remediation_id: logging_and_monitoring
  commentary: Internet-facing VoIP platforms are commonly targeted by authentication  attacks, SIP scanning,
    malformed message attacks, denial-of-service  attempts, and toll-fraud activity. Intrusion detection
    controls can assist  in identifying and responding to malicious behaviour before it affects  platform
    availability or security.
  positive: Intrusion detection controls were configured to detect and respond to  malicious SIP activity.
  guidance:
    common: "Review intrusion detection settings and confirm the platform is \nconfigured to detect, alert\
      \ on, and where appropriate block malicious \nSIP activity."
    audiocodes: "Setup > Signaling & Media > Intrusion Detection > IDS General Settings / \nIDS Policies\n\
      \nSetup > Signaling & Media > SBC > Malicious Signature\nSetup > Signaling & Media > Message Manipulation\
      \ > Message Policies\nSetup > Signaling & Media > Core Entities > SIP Interfaces"
  references:
  - https://www.ncsc.gov.uk/guidance/private-branch-exchange-best-practice
  - https://techdocs.audiocodes.com/session-border-controller-sbc/security/version-740/Content/Security/Implement%20Dynamic%20Blacklisting.htm
  - https://techdocs.audiocodes.com/session-border-controller-sbc/security/version-740/Content/Security/Define%20Malicious%20Signatures.htm
  applies_when:
    voip_solution:
    - AudioCodes
