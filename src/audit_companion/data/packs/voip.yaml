- id: signalling-and-media-encryption-not-enforced
  question: Are SIP signalling (SIPS) and voice communications (SRTP) encrypted where supported?
  expected_value: "TLS and SRTP are enabled where supported by connected systems and service \nproviders.\n\
    \  - Media Security: Enable (SRTP)\n  - SIPS: Enable (SIPS)\n\nWhere encryption is not supported,\
    \ the limitation should be documented."
  expected_answer: compliant
  finding_title: VoIP Signalling and Media Encryption Not Enforced
  description: SIP signalling and/or RTP media traffic were transmitted without encryption  despite support
    for SIPS and SRTP being available.
  solution: Protect SIP signalling with SIPS (SIP over TLS) and voice traffic with Secure RTP (SRTP) wherever
    supported by connected platforms, gateways, PBXs, and service providers.
  theme: Cryptography
  section: cryptography
  commentary_group: Cryptography and Communications Security
  remediation_id: cryptography_and_communications
  summary_commentary: SIP signalling and media traffic were not encrypted where supported, potentially exposing
    call metadata, authentication details, and voice communications to interception or manipulation.
  commentary_paragraph: 1
  commentary: Encryption was not enforced for VoIP signalling and media traffic where supported. SIP signalling
    contains call setup, routing, and authentication information, while RTP carries the voice conversation.
    Without SIPS and SRTP, this information and audio may be intercepted or manipulated by an attacker with
    access to the network path.
  positive: SIP signalling was protected using SIPS and voice media was protected using  SRTP where supported
    by connected systems.
  guidance:
    common: "Review SIP trunk, gateway, and VoIP security configuration to determine \nwhether SIP signalling\
      \ is protected using TLS and whether voice \ncommunications are protected using SRTP where supported\
      \ by connected \nsystems and service providers."
