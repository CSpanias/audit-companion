id: remote-access
title: Remote Access Security Assessment
version: '1.0'
executive_summary: >-
  A remote access configuration review was conducted for {client_name}, covering the {remote_access_solution}
  deployment. The assessment considered authentication controls, cryptographic standards, access governance,
  monitoring, and solution-specific security functionality.
executive_summary_findings_intro: >-
  The assessment identified opportunities for improvement across {areas}.
executive_summary_conclusion: >-
  Addressing the identified observations would strengthen the ongoing governance of remote access permissions
  and provide greater assurance that access remains aligned with business requirements.
executive_summary_positive_conclusion: >-
  Overall, the assessed remote access environment demonstrated a strong security posture and a sound foundation
  for protecting remote connectivity.
positive_summary_intro: >-
  Positive controls included {strengths}, supporting the secure operation and ongoing oversight of the remote
  access service.
commentary_intro: >-
  A remote access configuration review was conducted for {client_name}, covering the {remote_access_solution}
  deployment. The assessment reviewed the effectiveness of controls used to secure remote access services and
  protect access to internal systems and data.
commentary_findings_intro: >-
  The assessment identified opportunities for improvement across {areas}. The following sections summarise
  the relevant findings and security controls reviewed.
configuration_intro: >-
  The following table summarises the key characteristics of the remote access deployment assessed.
remediation_intro: "To maintain the security posture of the remote access solution:"
maintenance_recommendations:
- Continue to manage certificates and other authentication materials through documented issuance, renewal,
  revocation, and retirement processes where applicable.
- Periodically review remote access routes, network restrictions, and approved exceptions to confirm connectivity
  remains limited to authorised destinations.
- Maintain monitoring of remote access activity and administrative actions to support detection and investigation
  of security-relevant events.
- Periodically assess remote access cryptographic settings and authentication mechanisms against current vendor
  guidance and organisational security requirements.
report_groups:
  Platform Configuration:
    executive_summary_label: platform configuration
    executive_summary_priority: maintaining secure and reliable remote access functionality
    executive_summary_intro: The review also considered remote access platform configuration.
    executive_summary_conclusion: These controls help ensure remote connectivity is established consistently
      and in accordance with operational requirements.
    commentary_intro: Platform configuration controls were reviewed to determine whether remote connectivity
      operated as intended.
    commentary_conclusion: Maintaining appropriate platform configuration supports reliable and secure remote
      access.
  Authentication:
    executive_summary_label: authentication
    executive_summary_priority: strengthening user and device authentication
    executive_summary_intro: Opportunities for improvement were identified in authentication controls.
    executive_summary_conclusion: Strong authentication reduces the likelihood that compromised credentials
      or untrusted devices can be used to obtain remote access.
    commentary_intro: Authentication controls determine whether users and devices can establish trusted remote
      access connections.
    commentary_conclusion: Appropriate authentication controls help protect remote access from credential
      compromise and unauthorised use.
  Administrative Security:
    executive_summary_label: administrative security
    executive_summary_priority: strengthening privileged access safeguards
    executive_summary_intro: The review also considered administrative security.
    executive_summary_conclusion: Effective privileged access controls help reduce the impact of account misuse
      and support accountability for administrative actions.
    commentary_intro: Administrative security controls were assessed for the remote access platform.
    commentary_conclusion: Appropriate administrative safeguards help protect platform configuration and
      privileged access.
  Cryptography:
    executive_summary_label: cryptographic security
    executive_summary_priority: maintaining modern cryptographic protections
    executive_summary_intro: Cryptographic security was also assessed.
    executive_summary_conclusion: Modern cryptographic settings help protect the confidentiality and integrity
      of remote access communications.
    commentary_intro: The review assessed cryptographic protocols and algorithms used to protect remote access
      communications.
    commentary_conclusion: Maintaining current cryptographic protections reduces exposure to known protocol
      and algorithm weaknesses.
  Access Control:
    executive_summary_label: access governance and control
    executive_summary_priority: restricting and periodically reviewing remote access
    executive_summary_intro: The assessment identified opportunities to strengthen access governance and control.
    executive_summary_conclusion: These controls help ensure remote access is limited to authorised users,
      devices, networks, and destinations.
    commentary_intro: The review considered how remote access permissions and connectivity were restricted
      and governed.
    commentary_conclusion: Regular governance helps maintain least-privilege access and reduce unnecessary
      exposure.
  Monitoring and Detection:
    executive_summary_label: monitoring and detection
    executive_summary_priority: improving remote access monitoring and investigation
    executive_summary_intro: Monitoring and detection controls were also reviewed.
    executive_summary_conclusion: Effective logging supports the identification, investigation, and response
      to security-relevant activity.
    commentary_intro: Monitoring controls were assessed to determine whether remote access activity and
      administrative actions could be reviewed.
    commentary_conclusion: Appropriate logging and review help improve visibility and support incident response.
context:
- id: client_name
  label: What is the organisation's name?
  report_label: Organisation
  type: text
  phase: setup
  required: true
- id: remote_access_solution
  label: Which remote access solution is being reviewed?
  report_label: Remote access solution
  type: choice
  phase: setup
  required: true
  options:
  - Microsoft Always On VPN
  - BeyondTrust PRA
  - Other
- id: deployment_type
  label: How is the PRA solution deployed?
  report_label: Deployment model
  type: choice
  phase: context
  required: true
  options:
  - BeyondTrust Cloud
  - Hybrid
  - On-Premises Physical Appliance
  - On-Premises Virtual Appliance
  - Other
  description: The deployment model helps determine responsibility for appliance  management, platform
    maintenance, security updates, backup and disaster  recovery arrangements, and supporting infrastructure
    components.
  option_descriptions:
    BeyondTrust Cloud: BeyondTrust manages the underlying platform infrastructure and applies  critical
      platform updates. Connectivity is typically limited to TCP 443.
    Hybrid: The PRA appliance is cloud-hosted or externally managed, but supporting  components such as
      identity providers, Gateways, Jump Clients, managed  assets, or supporting infrastructure are hosted
      within the organisation's environment.
    On-Premises Virtual Appliance: The organisation is responsible for appliance updates, backups,  networking,
      disaster recovery, and infrastructure security. The platform  is hosted on customer-managed virtualisation
      infrastructure.
    On-Premises Physical Appliance: The organisation is responsible for appliance updates, backups,  networking,
      disaster recovery, and infrastructure security. The platform  is hosted on dedicated B Series appliance
      hardware.
  applies_when:
    remote_access_solution:
    - BeyondTrust PRA
- id: vpn_authentication_method
  label: What is the primary VPN authentication method?
  report_label: Authentication method
  type: choice
  phase: context
  required: true
  options:
  - Machine Certificate
  - User Certificate
  - EAP-TLS
  - PEAP
  - Username and Password
  - Username and Password with MFA
  - Other
  applies_when:
    remote_access_solution:
    - Microsoft Always On VPN
    - Other
- id: identity_provider
  label: What is the primary identity provider / authentication source?
  report_label: Identity provider
  type: choice
  phase: context
  required: true
  options:
  - Microsoft Entra ID
  - Active Directory
  - LDAP Directory
  - Local Accounts
  - Other
  description: The identity provider determines how users authenticate to the remote  access solution
    and influences the availability of security controls such  as multi-factor authentication, conditional
    access, user lifecycle management, identity governance, and access reviews.
  option_descriptions:
    Microsoft Entra ID: Users authenticate through Microsoft Entra ID, enabling centralised  identity
      management and integration with controls such as multi-factor  authentication, Conditional Access,
      identity governance, and access  reviews.
    Active Directory: Users authenticate through on-premises Active Directory. Authentication  and access
      management are controlled through domain-based identities,  groups, and policies.
    LDAP Directory: Users authenticate through a central LDAP-based directory service. User  identities,
      groups, and authentication policies are managed within the  directory platform.
    Local Accounts: Authentication relies on accounts managed directly within the remote  access platform
      rather than a central identity provider.
    Other: Authentication is performed using an alternative identity source not  captured by the predefined
      options.
  applies_when:
    remote_access_solution:
    - Microsoft Always On VPN
    - Other
    - BeyondTrust PRA
- id: tunnel_type
  label: Which VPN tunnel type is deployed?
  report_label: VPN tunnel type
  type: choice
  phase: context
  required: true
  options:
  - Device Tunnel
  - User Tunnel
  - Device and User Tunnel
  applies_when:
    remote_access_solution:
    - Microsoft Always On VPN
    - Other
- id: certificate_authority
  label: Which Certificate Authority is used for VPN authentication?
  report_label: Certificate authority
  type: choice
  phase: context
  required: true
  options:
  - Active Directory Certificate Services (AD CS)
  - Intune PKCS
  - Intune SCEP
  - Third-Party CA
  - Other
  applies_when:
    remote_access_solution:
    - Microsoft Always On VPN
    - Other
- id: split_tunnel_mode
  label: How is VPN traffic routed?
  report_label: VPN routing model
  type: choice
  phase: context
  required: true
  options:
  - Full Tunnel
  - Split Tunnel
  - Split-by-Exception
  applies_when:
    remote_access_solution:
    - Microsoft Always On VPN
    - Other
- id: product_version
  label: What version of BeyondTrust PRA is deployed?
  report_label: Product version
  type: text
  phase: context
  required: true
  description: The product version provides useful assessment context and may assist with  validating
    feature availability, release lifecycle status, and vendor  guidance during the review.
  guidance:
    BeyondTrust PRA: /appliance > Status > Information > Site Status > Product Version
  applies_when:
    remote_access_solution:
    - BeyondTrust PRA
questions:
- id: pra-update-management-not-defined
  question: Are appliance updates managed through a defined update process?
  expected_value: "Appliance updates are managed through a defined maintenance and update \nprocess."
  expected_answer: compliant
  finding_title: Appliance Update Process Not Defined
  description: Appliance updates were not managed through a defined update process.
  solution: Establish and maintain a documented update process for the BeyondTrust  appliance, including
    update monitoring, maintenance windows, testing,  approval, and deployment activities.
  theme: Platform Configuration
  commentary: Regular software maintenance helps ensure vulnerabilities, bug fixes, and  security improvements
    are applied in a timely manner. A defined update  process helps maintain platform security, stability,
    and vendor  supportability.
  positive: Appliance updates were managed through a defined update process.
  guidance:
    common: "Review how appliance updates are managed and determine whether updates \nare installed through\
      \ a defined and documented process."
    BeyondTrust PRA: /appliance > Updates
  references:
  - https://docs.beyondtrust.com/pra/docs/welcome-to-privileged-remote-access
  - https://docs.beyondtrust.com/pra/docs/pf-updates
  applies_when:
    remote_access_solution:
    - BeyondTrust PRA
- id: aovpn-prelogon-connectivity-disabled
  question: Is Always On VPN connectivity enforced without requiring user intervention?
  expected_value: "Always On VPN connectivity is established automatically without user \nintervention."
  expected_answer: compliant
  finding_title: Pre-Logon VPN Connectivity Not Available
  description: VPN connectivity was not available before user authentication.
  solution: Consider enabling pre-logon connectivity where organisational requirements  rely on device
    management or machine-based services prior to user  authentication.
  theme: Platform Configuration
  commentary: Pre-logon VPN connectivity supports device management, Group Policy  processing, certificate
    enrollment, and other infrastructure services  before user sign-in. Environments relying on device
    tunnels may require  this capability.
  positive: VPN connectivity was available prior to user logon.
  positive_commentary: VPN connectivity was established automatically before user logon, supporting device-level
    connectivity and management without requiring user intervention.
  positive_summary_commentary: Always On VPN connectivity was available before user logon.
  positive_summary_priority: 6
  guidance:
    common: "Determine whether VPN connectivity is established automatically without \nrequiring users\
      \ to manually launch or connect the VPN. Confirm \nconnectivity is available whenever the device\
      \ is outside trusted networks."
    Microsoft Always On VPN: "VPN Profile XML. Confirm AlwaysOn=true and Device Tunnel configuration \n\
      where applicable."
  references:
  - https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/
  applies_when:
    remote_access_solution:
    - Microsoft Always On VPN
  sureformat_id: SC-3448
- id: user-mfa-not-enforced
  question: Is multi-factor authentication enforced for all remote access users?
  expected_value: MFA / 2FA configured
  expected_answer: compliant
  finding_title: Multi-Factor Authentication Not Enforced for Users
  description: Multi-factor authentication was not enforced for remote access users, increasing the risk
    of account compromise through credential theft, password spraying, brute-force attacks, and credential
    reuse.
  solution: Configure multi-factor authentication as a mandatory requirement for all remote access user
    accounts.
  theme: Authentication
  commentary: Remote access relied solely on single-factor authentication. Compromise of user credentials
    may allow an attacker to obtain privileged access to organisational systems and services. Multi-factor
    authentication provides an additional layer of protection by requiring users to present a second authentication
    factor beyond a password.
  positive: Multi-factor authentication was enforced for all remote access users.
  positive_commentary: Multi-factor authentication was enforced for remote access users, providing an additional
    verification step beyond primary credentials.
  positive_summary_commentary: Multi-factor authentication was enforced for remote access users.
  positive_summary_priority: 4
  guidance:
    common: "Review the authentication configuration and determine whether all users \nare required to\
      \ complete multi-factor authentication before remote access \nis granted."
    BeyondTrust PRA: '/login > Users & Security > Group Policies > Account Settings


      - Two Factor Authentication: Checked

      - Log in with an authenticator app: Required

      - Log in with TOTP ?

      - Log in with FIDO2 ?'
    Microsoft Always On VPN: NPS > Network Policies > Authentication Configuration
  references:
  - https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/
  - https://docs.beyondtrust.com/pra/docs/pf-group-policies#group-policy-settings
  applies_when:
    remote_access_solution:
    - Microsoft Always On VPN
    - Other
    - BeyondTrust PRA
- id: admin-mfa-not-enforced
  question: Are administrative and privileged accounts protected by multi-factor authentication?
  expected_value: '- Two Factor Authentication: Checked

    - Log in with an authenticator app: Required'
  expected_answer: compliant
  finding_title: Administrator Multi-Factor Authentication Not Enforced
  description: Multi-factor authentication was not enforced for administrative or  privileged accounts,
    increasing the risk of administrative account  compromise.
  solution: Configure multi-factor authentication as a mandatory control for all administrative and privileged
    accounts.
  theme: Authentication
  commentary: Administrative accounts provide highly privileged access to the remote  access platform.
    Compromise of such accounts may allow an attacker to  modify configurations, weaken security controls,
    access sensitive systems,  or establish persistent access. Multi-factor authentication helps reduce
    the risk of administrative account compromise.
  positive: Multi-factor authentication was enforced for administrative and privileged  accounts.
  positive_commentary: Administrative and privileged accounts were protected by multi-factor authentication,
    reducing the risk of unauthorised platform management.
  positive_summary_commentary: Administrative and privileged accounts were protected by multi-factor authentication.
  positive_summary_priority: 5
  guidance:
    common: "Review the authentication requirements applied to administrative, \nprivileged, break-glass,\
      \ and platform management accounts. Verify that \nMFA is enforced for all accounts capable of administering\
      \ or managing the \nremote access solution."
    BeyondTrust PRA: "/login > Users & Security > Group Policies > Account Settings\n\nReview Group Policies\
      \ assigned to administrators and verify MFA \nrequirements such as TOTP or FIDO2 are enforced."
  references:
  - https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/
  - https://docs.beyondtrust.com/pra/docs/pf-group-policies#group-policy-settings
  applies_when:
    remote_access_solution:
    - Microsoft Always On VPN
    - Other
    - BeyondTrust PRA
- id: aovpn-device-authentication-not-enforced
  question: "Is machine certificate authentication required for Device Tunnel \nconnections?"
  expected_value: Device Tunnel connections authenticate using machine certificates only.
  expected_answer: compliant
  finding_title: Device Authentication Not Enforced
  description: Device Tunnel connections were not restricted to machine certificate  authentication.
  solution: Restrict Device Tunnel authentication to machine certificates to ensure connectivity is limited
    to trusted and managed devices.
  theme: Authentication
  commentary: Device Tunnel connectivity should rely on device identity rather than user  credentials.
    Failure to enforce device authentication may reduce assurance  that connecting systems are trusted
    and managed.
  positive: Device Tunnel connectivity required machine certificates.
  positive_commentary: Device Tunnel connections required machine certificate authentication, helping ensure
    that remote connectivity was established by trusted, managed devices.
  positive_summary_commentary: Machine certificate authentication was required for Device Tunnel connections.
  positive_summary_priority: 1
  guidance:
    common: "Determine how Device Tunnel connections authenticate to the VPN service. \nConfirm device\
      \ identity is validated using machine certificates rather \nthan user credentials and verify only\
      \ trusted, managed devices can \nestablish Device Tunnel connections."
    Microsoft Always On VPN: "NPS > Network Policies > Constraints > Authentication Methods, and RRAS\
      \ > \nSecurity > Authentication Provider\n\nConfirm Device Tunnel connections require machine certificate\
      \ \nauthentication."
  references:
  - https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/
  applies_when:
    remote_access_solution:
    - Microsoft Always On VPN
- id: pra-vendor-authentication-not-secure
  question: Are vendor authentication controls configured in accordance with organisational security requirements?
  expected_value: 'Vendor Authentication:

    - Vendor Account Lockout After: configured

    - Vendor Account Lockout Duration: configured


    Vendor Passwords:

    - Minimum Password Length: configured

    - Complex Passwords: required

    - Password Expiration: configured

    - Default Authentication Method: ?

    - Default Password Expiration: ?'
  expected_answer: compliant
  finding_title: Vendor Authentication Controls Not Sufficiently Configured
  description: Vendor authentication controls were not configured in accordance with  organisational security
    requirements.
  solution: Review and strengthen vendor authentication controls. Ensure that  appropriate security settings
    such as MFA, password complexity, account  lockout protections, and secure account management controls
    are enforced  for all vendor accounts.
  theme: Authentication
  commentary: Vendor accounts often provide external users with privileged or sensitive  access to organisational
    systems. Weak authentication controls may increase  the risk of account compromise through password
    attacks, credential theft,  or unauthorised access. Appropriate authentication controls help ensure  that
    third-party access is governed and protected in line with  organisational security requirements.
  positive: Vendor authentication controls were configured in accordance with  organisational security
    requirements.
  guidance:
    common: 'Review the authentication controls applied to vendor accounts and

      determine whether appropriate security settings are configured.'
    BeyondTrust PRA: Management > Security > Vendor Authentication / Vendor Passwords
  references:
  - https://docs.beyondtrust.com/pra/docs/pf-security#vendor-authentication
  applies_when:
    remote_access_solution:
    - BeyondTrust PRA
- id: shared-accounts-permitted
  question: Are individual user accounts required for remote access?
  expected_value: All remote access users are assigned unique individual accounts.
  expected_answer: compliant
  finding_title: Shared Accounts Permitted
  description: Shared accounts were permitted, reducing accountability and increasing the  difficulty
    of attributing activity to specific users.
  solution: Replace shared accounts with uniquely assigned user accounts to improve  accountability and
    auditability.
  theme: Authentication
  commentary: The use of shared accounts limits auditability and may prevent accurate  attribution of
    actions performed through remote access connections.
  positive: All remote access was performed using uniquely assigned accounts.
  guidance:
    common: "Determine how users authenticate to the remote access platform and \nwhether uniquely assigned\
      \ identities are used. Confirm that generic, \nshared, or team accounts are not used for remote\
      \ access activities."
    BeyondTrust PRA: "Review the user account inventory and authentication model. Determine \nwhether\
      \ users authenticate using individually assigned accounts through \nSSO, a directory service, or\
      \ local platform accounts. Confirm that shared\noperational or administrative accounts are not used."
  references:
  - https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/
  applies_when:
    remote_access_solution:
    - Microsoft Always On VPN
    - Other
    - BeyondTrust PRA
- id: local-accounts-enabled
  question: Is remote access authentication integrated with a centrally managed identity provider?
  expected_value: Authentication is integrated with a centrally managed identity provider and  locally
    managed platform accounts are restricted to approved administrative  or emergency access scenarios.
  expected_answer: compliant
  finding_title: Local Accounts Enabled
  description: Remote access authentication relied on locally managed accounts rather than  an enterprise
    identity provider.
  solution: Migrate remote access authentication to a centrally managed identity platform such as Entra
    ID, Active Directory, LDAP, or RADIUS.
  theme: Authentication
  commentary: The remote access platform relied primarily on locally managed accounts rather than a centrally
    managed identity provider. This may reduce visibility, governance, lifecycle management, access review
    capabilities, and the consistent enforcement of controls such as multi-factor authentication and conditional
    access policies.
  positive: Remote access authentication was integrated with a central identity provider.
  positive_commentary: Remote access authentication was integrated with a centrally managed identity provider,
    supporting consistent identity lifecycle and access governance.
  positive_summary_commentary: Remote access authentication used a centrally managed identity provider.
  positive_summary_priority: 5
  guidance:
    common: "Review the configured authentication source and determine whether users \nauthenticate through\
      \ a centrally managed identity platform such as \nMicrosoft Entra ID, Active Directory, or an enterprise\
      \ directory service. \nConfirm that reliance on locally managed platform accounts is minimised \n\
      and restricted to approved administrative or break-glass use cases."
    BeyondTrust PRA: "Users & Security > Security Providers\n\nReview configured Security Providers and\
      \ determine whether users \nauthenticate through centrally managed identity providers (e.g. SAML,\
      \ \nOIDC, LDAP, AD) instead of locally managed PRA accounts where appropriate."
  references:
  - https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/
  - https://docs.beyondtrust.com/pra/docs/pf-security-providers
  applies_when:
    remote_access_solution:
    - Microsoft Always On VPN
    - Other
    - BeyondTrust PRA
- id: vpn-weak-authentication-methods
  question: Are only modern and secure authentication methods permitted?
  expected_value: Authentication relies on centrally managed identity services, MFA-enabled  authentication,
    and vendor-supported authentication protocols. Deprecated,  insecure, or password-only authentication
    methods are disabled.
  expected_answer: compliant
  finding_title: Weak Authentication Methods Allowed
  description: Legacy authentication mechanisms were enabled, increasing exposure to  credential attacks
    and authentication bypass.
  solution: Retire legacy authentication mechanisms and standardise on modern, vendor-supported authentication
    methods.
  theme: Authentication
  commentary: Legacy authentication mechanisms may be susceptible to password attacks,  credential interception,
    replay attacks, and other forms of authentication  abuse. Modern authentication methods provide stronger
    protection and typically support additional security controls such as multi-factor  authentication
    and centralised identity integration.
  positive: Legacy authentication mechanisms were disabled.
  positive_commentary: Deprecated and insecure authentication methods were disabled in favour of modern,
    vendor-supported alternatives.
  positive_summary_commentary: Deprecated and insecure authentication methods were disabled.
  positive_summary_priority: 3
  guidance:
    common: Review configured authentication methods and confirm deprecated or  insecure authentication
      mechanisms are not permitted where the platform  supports stronger alternatives. Examples may include
      PAP, CHAP,  password-only authentication, or other legacy authentication methods.
  references:
  - https://learn.microsoft.com/windows-server/remote/remote-access/vpn/always-on-vpn/
  applies_when:
    remote_access_solution:
    - Microsoft Always On VPN
    - Other
- id: pra-credential-injection-not-used
  question: Are credentials injected rather than disclosed to users?
  expected_value: Privileged credentials are injected and are not disclosed to end users.
  expected_answer: compliant
  finding_title: Credentials Disclosed to Users
  description: Privileged credentials were exposed to end users rather than being managed  through credential
    injection.
  solution: Where supported, use credential injection mechanisms to avoid exposing  privileged credentials
    to users.
  theme: Administrative Security
  commentary: Credential injection reduces the risk of password disclosure, reuse,  unauthorised storage,
    and misuse by privileged users.
  positive: Credential injection was used for privileged access.
  guidance:
    common: "Review how privileged users access managed systems. Determine whether \ncredentials are supplied\
      \ automatically by the platform through credential \ninjection or whether users are able to view,\
      \ copy, export, or manually \nenter privileged credentials."
    BeyondTrust PRA: "Review Password Safe and session launch workflows. Verify whether users \nestablish\
      \ privileged sessions using credential injection mechanisms or \nwhether passwords are disclosed\
      \ to users before or during access."
  references:
  - https://docs.beyondtrust.com/pra/docs/desktop-credential-injection
  applies_when:
    remote_access_solution:
    - BeyondTrust PRA
- id: pra-file-transfer-malware-scanning-not-enabled
  question: Are transferred files subject to malware scanning before delivery?
  expected_value: 'File transfers are inspected by an integrated malware scanning solution

    prior to delivery.'
  expected_answer: compliant
  finding_title: File Transfer Malware Scanning Not Enabled
  description: File transfers were not inspected for malicious content prior to delivery.
  solution: Consider integrating PRA file transfers with an ICAP-compatible malware scanning platform
    where additional inspection and content filtering capabilities are required.
  theme: Administrative Security
  commentary: BeyondTrust PRA supports integration with external ICAP-compatible malware  scanning solutions
    for certain file transfers. While not a baseline  requirement for secure PRA operation, this capability
    may provide an additional layer of defence-in-depth for organisations with enhanced  monitoring, malware
    prevention, or regulatory requirements.
  positive: File transfers were inspected using integrated malware scanning controls.
  guidance:
    common: "Review whether an ICAP server is configured and whether file transfers \nare inspected before\
      \ delivery."
    BeyondTrust PRA: /login > Management > Security > ICAP Configuration
  references:
  - https://docs.beyondtrust.com/pra/docs/pf-security#icap-configuration
  applies_when:
    remote_access_solution:
    - BeyondTrust PRA
- id: pra-session-context-not-required
  question: "Are users required to provide a ticket reference or business justification \nbefore initiating\
    \ privileged sessions?"
  expected_value: "Review the Context Requirement settings and determine whether users are \nrequired\
    \ to provide a ticket ID or business justification prior to starting \nprivileged sessions."
  expected_answer: compliant
  finding_title: Session Context Not Required
  description: Privileged sessions could be initiated without requiring users to provide  business justification
    or a ticket reference.
  solution: Configure Asset Policies to require a ticket reference, business  justification, or equivalent
    access context before privileged sessions are  initiated.
  theme: Administrative Security
  commentary: Requiring a ticket reference or business justification increases  accountability and helps
    organisations demonstrate that privileged access  activities relate to legitimate business requirements.
    Session context also improves auditability and can assist with incident investigation and change  tracking.
  positive: Privileged sessions required users to provide appropriate business context  before access
    was granted.
  guidance:
    common: "Determine whether users must provide operational context before accessing \nprivileged systems.\
      \ Examples include ticket numbers, change references, \nincident references, or free-text business\
      \ justification."
    BeyondTrust PRA: Asset Management > Asset Policies > Context Requirement
  references:
  - https://docs.beyondtrust.com/pra/docs/pf-jump-policies#context-requirement
  applies_when:
    remote_access_solution:
    - BeyondTrust PRA
- id: pra-vault-password-rotation-not-enforced
  question: Are privileged credentials rotated automatically?
  expected_value: 'Vault Account Policies enforce:

    - Scheduled password rotation

    - A defined maximum password age

    - Automatic credential rotation after credential check-in where supported'
  expected_answer: compliant
  finding_title: Privileged Credential Rotation Not Enforced
